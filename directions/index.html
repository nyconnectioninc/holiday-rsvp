<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directions · Soundview Caterers · NY Connection Holiday Party</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Directions to Soundview Caterers">
<meta property="og:description" content="45 Bayville Ave, Bayville, NY 11709 · NY Connection Holiday Party · Sun, Dec 13 · 7:00 PM">
<style>
  :root{--beige:#EFE3CB;--card:#F8F1E3;--gold:#B8893A;--gold-dk:#8C6A2B;--ink:#3A2A1E;--ink2:#5C4632}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--beige);color:var(--ink);font-family:Georgia,'Times New Roman',serif;padding:24px}
  main{width:100%;max-width:420px;background:var(--card);border:2px solid var(--gold);padding:30px 26px;text-align:center}
  .eyebrow{margin:0;font-size:11px;font-weight:bold;letter-spacing:.18em;white-space:nowrap;color:var(--gold-dk)}
  h1{margin:10px 0 2px;font-size:26px;letter-spacing:.06em}
  .addr{margin:0;font-size:18px;line-height:1.5}
  .status{margin:18px 0 6px;font-style:italic;color:var(--ink2);font-size:16px;min-height:1.4em}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px;border-radius:999px;font-weight:bold;font-size:15px;letter-spacing:.12em;text-decoration:none;white-space:nowrap}
  a.primary{background:#A47C35;color:#FFF8E6}
  a.secondary{background:var(--card);color:var(--gold-dk);border:1.5px solid var(--gold)}
  a.btn:focus-visible{outline:3px solid rgba(184,137,58,.6);outline-offset:2px}
  .foot{margin:22px 0 0;font-size:12px;font-weight:bold;letter-spacing:.2em;color:var(--ink2)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">NY CONNECTION HOLIDAY PARTY</p>
  <h1>Soundview Caterers</h1>
  <p class="addr">45 Bayville Ave<br>Bayville, NY 11709</p>
  <p class="status" id="status" aria-live="polite">Opening your maps app…</p>
  <div class="btns">
    <a class="btn primary" id="apple" href="https://maps.apple.com/?q=Soundview+Caterers&amp;address=45+Bayville+Ave,+Bayville,+NY+11709">APPLE MAPS</a>
    <a class="btn primary" id="google" href="https://www.google.com/maps/search/?api=1&amp;query=Soundview+Caterers+45+Bayville+Ave+Bayville+NY+11709">GOOGLE MAPS</a>
  </div>
  <p class="foot">SUNDAY · DECEMBER 13 · 7:00 PM</p>
</main>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isMac = /Macintosh/i.test(ua) && !isIOS;
  var status = document.getElementById("status");
  var apple = document.getElementById("apple");
  var google = document.getElementById("google");
  var target;

  if (isIOS) {
    // Apple Maps app (respects the iPhone's default navigation app where Apple allows it)
    target = "maps://?q=Soundview%20Caterers&address=45%20Bayville%20Ave,%20Bayville,%20NY%2011709";
    google.parentNode.insertBefore(apple, google); // Apple first
  } else if (isAndroid) {
    // geo: opens the phone's default maps app (Google Maps, Waze, etc.)
    target = "geo:0,0?q=" + encodeURIComponent("45 Bayville Ave, Bayville, NY 11709 (Soundview Caterers)");
    google.parentNode.insertBefore(google, apple); // Google first
  } else if (isMac) {
    target = apple.href;
  } else {
    target = google.href;
    google.parentNode.insertBefore(google, apple);
  }

  window.__directionsTarget = target;
  if (!/[?&]noredirect\b/.test(location.search)) {
    try { window.location.href = target; } catch (e) {}
  }
  setTimeout(function () { status.textContent = "Didn't open? Pick your maps app:"; }, 1500);
})();
</script>
</body>
</html>
